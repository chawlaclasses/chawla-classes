<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Report — Chawla Classes</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
    <link rel="shortcut icon" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A1628;
    --gold: #F5A623;
    --gold-dim: #c8841a;
    --gold-glow: rgba(245,166,35,0.18);
    --white: #F8F9FC;
    --text: #e2e8f4;
    --muted: #7a90b8;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --surface: rgba(30,58,110,0.35);
    --input-bg: rgba(10,22,40,0.7);
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--navy); color: var(--text); font-family: 'Inter', sans-serif;
    min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; top: -200px; left: -200px; width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(245,166,35,0.06) 0%, transparent 70%); pointer-events: none; z-index: 0;
  }
  .wrap { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }

  header {
    display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;
    margin-bottom: 24px; padding: 20px 28px;
    background: var(--surface); border: 1px solid var(--card-border); border-radius: var(--radius);
    backdrop-filter: blur(20px); position: relative; overflow: hidden;
  }
  header::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: linear-gradient(180deg, var(--gold), var(--gold-dim)); border-radius: 4px 0 0 4px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header-icon {
    width: 44px; height: 44px; background: var(--gold-glow); border: 1px solid rgba(245,166,35,0.25);
    border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin: 0 0 6px; }
  h1 { font-size: 24px; font-weight: 800; line-height: 1.15; margin: 0 0 4px; color: var(--white); }
  .subtitle { font-size: 13px; color: var(--muted); margin: 0; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px;
    border: 1px solid var(--card-border); border-radius: var(--radius-sm); background: var(--card-bg);
    color: var(--text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; text-decoration: none;
  }
  .btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-glow); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
  .btn-gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-dim)); color: var(--navy); border: none;
    box-shadow: 0 3px 12px var(--gold-glow);
  }
  .btn-gold:hover { box-shadow: 0 5px 20px rgba(245,166,35,0.35); transform: translateY(-1px); color: var(--navy); }
  .toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }

  .banner { display: none; padding: 13px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 18px; border: 1px solid transparent; }
  .banner.show { display: block; }
  .banner.error { background: rgba(239,68,68,0.08); color: #fca5a5; border-color: rgba(239,68,68,0.2); }
  .banner.success { background: rgba(34,197,94,0.08); color: #86efac; border-color: rgba(34,197,94,0.2); }

  .card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 22px 24px; margin-bottom: 18px; backdrop-filter: blur(12px);
  }
  .card h3 { font-size: 14px; color: var(--white); margin-bottom: 14px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
  .stat { text-align: center; padding: 14px; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: var(--radius-sm); }
  .stat .val { font-size: 19px; font-weight: 800; color: var(--gold); }
  .stat .lbl { font-size: 10.5px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

  .profile-line { font-size: 13px; color: var(--text); margin-bottom: 4px; }
  .profile-line b { color: var(--white); }

  /* Print styles */
  @media print {
    body { background: #fff !important; color: #000 !important; }
    body::before { display: none; }
    header, .toolbar { display: none !important; }
    .card { background: #fff !important; border: 1px solid #ccc !important; break-inside: avoid; backdrop-filter: none !important; }
    .card h3 { color: #333 !important; }
    .stat { background: #f7f7f7 !important; border: 1px solid #ddd !important; }
    .stat .val { color: #333 !important; }
    .stat .lbl, .profile-line { color: #555 !important; }
    .profile-line b { color: #000 !important; }
    .wrap { max-width: 100%; padding: 0; }
  }

  @media (max-width: 640px) {
    .wrap { padding: 16px 12px 60px; }
    header { padding: 16px 18px; flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="header-left">
      <div class="header-icon">📄</div>
      <div>
        <p class="eyebrow">Student Portal</p>
        <h1>My Report</h1>
        <p class="subtitle">A consolidated summary of your progress</p>
      </div>
    </div>
    <a href="/student/dashboard.html" class="btn">‹ Back to Dashboard</a>
  </header>

  <div class="banner" id="banner" role="status" aria-live="polite"></div>

  <div class="toolbar">
    <button class="btn btn-gold" onclick="downloadReport('pdf', this)">⬇ Download PDF</button>
    <button class="btn" onclick="downloadReport('csv', this)">⬇ Download Excel (CSV)</button>
    <button class="btn" onclick="window.print()">🖨 Print</button>
  </div>

  <div class="card">
    <h3>Student Details</h3>
    <div id="profileBlock"><div class="profile-line">Loading…</div></div>
  </div>

  <div class="card">
    <h3>📅 Attendance</h3>
    <div class="stat-grid" id="attendanceGrid"><div>Loading…</div></div>
  </div>

  <div class="card">
    <h3>📝 Test Results</h3>
    <div class="stat-grid" id="resultsGrid"><div>Loading…</div></div>
  </div>

  <div class="card">
    <h3>💰 Fees</h3>
    <div class="stat-grid" id="feesGrid"><div>Loading…</div></div>
  </div>

  <div class="card">
    <h3>📚 Homework</h3>
    <div class="stat-grid" id="homeworkGrid"><div>Loading…</div></div>
  </div>

  <div class="card" id="engagementCard" style="display:none;">
    <h3>🏆 Engagement</h3>
    <div class="stat-grid" id="engagementGrid"></div>
  </div>
</div>

<script>
  const API_BASE = '/api';
  const token = localStorage.getItem('studentToken');
  if (!token) { window.location.href = '/student/login.html'; }

  function showBanner(msg, type) {
    const banner = document.getElementById('banner');
    banner.textContent = msg;
    banner.className = `banner show ${type}`;
    setTimeout(() => banner.classList.remove('show'), 4000);
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function statCard(val, lbl) {
    return `<div class="stat"><div class="val">${escapeHtml(String(val))}</div><div class="lbl">${escapeHtml(lbl)}</div></div>`;
  }

  async function loadReport() {
    try {
      const response = await fetch(`${API_BASE}/reports/my-report`, { headers: { 'Authorization': `Bearer ${token}` } });
      if (response.status === 401) {
        showBanner('Session expired. Redirecting to login...', 'error');
        setTimeout(() => { localStorage.removeItem('studentToken'); window.location.href = '/student/login.html'; }, 1500);
        return;
      }
      const result = await response.json();
      if (!result.success) { showBanner('Could not load report.', 'error'); return; }
      render(result.data);
    } catch (e) {
      showBanner('Network error. Please try again.', 'error');
    }
  }

  function render(d) {
    document.getElementById('profileBlock').innerHTML = `
      <div class="profile-line"><b>${escapeHtml(d.student.name)}</b></div>
      <div class="profile-line">Roll No: ${escapeHtml(d.student.rollNumber) || '—'}</div>
      <div class="profile-line">Class: ${escapeHtml(d.student.className)}</div>
    `;

    document.getElementById('attendanceGrid').innerHTML =
      statCard(`${d.attendance.percentage}%`, 'Attendance') +
      statCard(d.attendance.present, 'Present') +
      statCard(d.attendance.absent, 'Absent');

    document.getElementById('resultsGrid').innerHTML =
      statCard(d.results.testsAttempted, 'Tests') +
      statCard(`${d.results.averagePercentage}%`, 'Average') +
      statCard(`${d.results.bestPercentage}%`, 'Best') +
      statCard(`${d.results.passRate}%`, 'Pass Rate');

    document.getElementById('feesGrid').innerHTML =
      statCard(`₹${d.fees.totalBilled}`, 'Billed') +
      statCard(`₹${d.fees.totalPaid}`, 'Paid') +
      statCard(`₹${d.fees.totalPending}`, 'Pending') +
      statCard(d.fees.overdueCount, 'Overdue');

    document.getElementById('homeworkGrid').innerHTML =
      statCard(d.homework.assigned, 'Assigned') +
      statCard(d.homework.submitted, 'Submitted') +
      statCard(d.homework.graded, 'Graded') +
      statCard(d.homework.averageScore ?? 'N/A', 'Avg Score');

    if (d.gamification) {
      document.getElementById('engagementCard').style.display = 'block';
      document.getElementById('engagementGrid').innerHTML =
        statCard(d.gamification.level, 'Level') +
        statCard(d.gamification.xp, 'XP') +
        statCard(`${d.gamification.streak}🔥`, 'Streak');
    }
  }

  async function downloadReport(format, btn) {
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Preparing...';
    try {
      const response = await fetch(`${API_BASE}/reports/my-report?format=${format}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!response.ok) throw new Error('Download failed');
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = format === 'pdf' ? 'my-report.pdf' : 'my-report.csv';
      document.body.appendChild(a); a.click(); a.remove();
      window.URL.revokeObjectURL(url);
    } catch (e) {
      showBanner('Could not download report.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  // ==================== Init ====================
  loadReport();
</script>

</body>
</html>
