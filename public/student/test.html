<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Test — Chawla Classes</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
    <link rel="shortcut icon" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0A1628;
      --navy-mid: #1E3A6E;
      --gold: #F5A623;
      --gold-dim: #c8841a;
      --gold-glow: rgba(245,166,35,0.18);
      --white: #F8F9FC;
      --text: #e2e8f4;
      --muted: #7a90b8;
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.08);
      --surface: rgba(30,58,110,0.35);
      --input-bg: rgba(10,22,40,0.7);
      --success: #22c55e;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      background: var(--navy);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 20px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(245,166,35,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -200px; right: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(30,58,110,0.5) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    .header {
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px 28px;
      backdrop-filter: blur(20px);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, var(--gold), var(--gold-dim));
      border-radius: 4px 0 0 4px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-icon {
      width: 44px; height: 44px;
      background: var(--gold-glow);
      border: 1px solid rgba(245,166,35,0.25);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--white);
      margin: 0;
    }
    .header .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .test-info {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    .test-info-item {
      font-size: 13px;
      color: var(--muted);
    }
    .test-info-item strong {
      color: var(--white);
      font-weight: 600;
    }

    /* ── TIMER ── */
    .timer-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius-sm);
      padding: 8px 18px;
    }
    .timer-container .timer-icon {
      font-size: 20px;
    }
    #timer {
      font-size: 22px;
      font-weight: 700;
      color: #fca5a5;
      font-variant-numeric: tabular-nums;
    }
    .timer-warning { color: #fcd34d; }
    .timer-danger { color: #ef4444; animation: pulse 1s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── PROGRESS BAR ── */
    .progress-container {
      background: rgba(255,255,255,0.05);
      border-radius: var(--radius-sm);
      height: 6px;
      margin: 16px 0 20px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-dim));
      transition: width 0.5s ease;
      border-radius: var(--radius-sm);
    }

    /* ── QUIZ CARD ── */
    .quiz-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px;
      backdrop-filter: blur(12px);
      margin-bottom: 24px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .quiz-header h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .question-counter {
      font-size: 14px;
      color: var(--muted);
      background: rgba(255,255,255,0.05);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
    }

    /* ── QUESTION NAVIGATION ── */
    .question-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .question-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--card-border);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .question-dot:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    .question-dot.active {
      border-color: var(--gold);
      background: var(--gold-glow);
      color: var(--gold);
    }
    .question-dot.answered {
      border-color: var(--success);
      background: rgba(34,197,94,0.15);
      color: var(--success);
    }
    .question-dot.review {
      border-color: var(--purple);
      background: rgba(139,92,246,0.15);
      color: var(--purple);
    }

    /* ── QUESTION ── */
    .question-block {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 20px 24px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .question-block:hover {
      border-color: rgba(245,166,35,0.2);
    }

    .question-type {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .question-type.mcq-type {
      background: rgba(245,166,35,0.12);
      color: #fcd34d;
      border: 1px solid rgba(245,166,35,0.2);
    }

    .question-number {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      display: block;
    }

    .question-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--white);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      color: var(--text);
    }
    .option-label:hover {
      border-color: rgba(245,166,35,0.3);
      background: rgba(245,166,35,0.05);
    }
    .option-label input[type="radio"] {
      width: 16px;
      height: 16px;
      accent-color: var(--gold);
      cursor: pointer;
      flex-shrink: 0;
    }
    .option-label:has(input:checked) {
      border-color: var(--gold);
      background: rgba(245,166,35,0.08);
    }
    .option-label input[type="radio"]:checked + .option-text {
      color: var(--white);
      font-weight: 600;
    }
    .option-text {
      color: var(--text);
      transition: color 0.2s;
    }

    /* ── BUTTONS ── */
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      color: var(--navy);
      box-shadow: 0 3px 12px var(--gold-glow);
    }
    .btn-primary:hover {
      box-shadow: 0 5px 20px rgba(245,166,35,0.35);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--card-border);
      color: var(--text);
    }
    .btn-secondary:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-glow);
    }

    .btn-danger {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }
    .btn-danger:hover {
      background: rgba(239,68,68,0.25);
      border-color: var(--danger);
    }

    .btn-success {
      background: rgba(34,197,94,0.15);
      border: 1px solid rgba(34,197,94,0.3);
      color: #86efac;
    }
    .btn-success:hover {
      background: rgba(34,197,94,0.25);
      border-color: var(--success);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .empty-icon {
      font-size: 56px;
      margin-bottom: 16px;
      display: block;
    }
    .empty-state strong {
      display: block;
      color: var(--white);
      font-size: 18px;
      margin-bottom: 6px;
    }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: var(--navy-mid);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 480px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal h2 {
      color: var(--white);
      font-size: 22px;
      margin-bottom: 12px;
    }
    .modal p {
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .modal-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0 24px;
    }
    .modal-stat {
      background: rgba(255,255,255,0.05);
      padding: 12px;
      border-radius: var(--radius-sm);
      text-align: center;
    }
    .modal-stat .label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .modal-stat .value {
      display: block;
      font-size: 20px;
      font-weight: 700;
      color: var(--white);
      margin-top: 4px;
    }
    .modal .btn-group {
      justify-content: center;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      body { padding: 16px 12px; }
      .header { padding: 16px 18px; flex-direction: column; align-items: stretch; }
      .header h1 { font-size: 20px; }
      .quiz-container { padding: 16px; }
      .question-block { padding: 14px 16px; }
      .question-text { font-size: 14px; }
      .option-label { padding: 10px 12px; font-size: 13px; }
      .timer-container { justify-content: center; }
      .btn-group { flex-direction: column; }
      .btn-group .btn { width: 100%; justify-content: center; }
      .question-dot { width: 30px; height: 30px; font-size: 10px; }
      .test-info { flex-direction: column; align-items: flex-start; gap: 4px; }
      .modal { padding: 20px; }
      .modal-stats { grid-template-columns: 1fr 1fr; gap: 8px; }
    }
  </style>
</head>
<body>

<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="header-icon">📝</div>
      <div>
        <h1 id="testTitle">Online Test</h1>
        <div class="subtitle" id="testDescription">Answer all questions carefully</div>
      </div>
    </div>
    <div class="test-info">
      <span class="test-info-item">📊 <strong id="totalMarksDisplay">0</strong> marks</span>
      <span class="test-info-item">📝 <strong id="totalQuestionsDisplay">0</strong> questions</span>
      <div class="timer-container">
        <span class="timer-icon">⏳</span>
        <span id="timer">30:00</span>
      </div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-container">
    <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
  </div>

  <!-- QUIZ -->
  <div class="quiz-container">
    <div class="quiz-header">
      <h2>📋 Questions</h2>
      <span class="question-counter" id="questionCounter">0 / 0</span>
    </div>

    <!-- Question Navigation -->
    <div class="question-nav" id="questionNav"></div>

    <!-- Question Area -->
    <div id="quiz">⏳ Loading questions...</div>

    <!-- Navigation Buttons -->
    <div class="btn-group" style="margin-top: 20px;">
      <button class="btn btn-secondary" onclick="previousQuestion()">⬅ Previous</button>
      <button class="btn btn-secondary" onclick="nextQuestion()">Next ➡</button>
      <button class="btn btn-success" onclick="toggleReview()">🔖 Mark for Review</button>
    </div>
  </div>

  <!-- ACTION BUTTONS -->
  <div class="btn-group">
    <button class="btn btn-primary" id="submitBtn" onclick="showSubmitModal()">📤 Submit Test</button>
    <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">‹ Back to Dashboard</button>
  </div>

</div>

<!-- SUBMIT MODAL -->
<div class="modal-overlay" id="submitModal">
  <div class="modal">
    <h2>📤 Submit Test?</h2>
    <p>You are about to submit your test. Please review your answers before submitting.</p>
    <div class="modal-stats">
      <div class="modal-stat">
        <span class="label">Total Questions</span>
        <span class="value" id="modalTotal">0</span>
      </div>
      <div class="modal-stat">
        <span class="label">Answered</span>
        <span class="value" id="modalAnswered">0</span>
      </div>
      <div class="modal-stat">
        <span class="label">Unanswered</span>
        <span class="value" id="modalUnanswered">0</span>
      </div>
      <div class="modal-stat">
        <span class="label">Marked for Review</span>
        <span class="value" id="modalReview">0</span>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="submitTest()">✅ Confirm Submit</button>
      <button class="btn btn-secondary" onclick="closeModal()">✖ Cancel</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const API_BASE = '/api/student';

// State
let state = {
  attemptId: null,
  testId: null,
  questions: [],
  currentIndex: 0,
  answers: {},
  markedForReview: new Set(),
  timerInterval: null,
  timeLeft: 0,
  totalDuration: 0,
  isSubmitted: false
};

// ============================================================
// INITIALIZATION
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const testId = urlParams.get('id');
  const attemptId = urlParams.get('attempt');

  if (testId) {
    state.testId = testId;
    startNewTest(testId);
  } else if (attemptId) {
    state.attemptId = attemptId;
    resumeTest(attemptId);
  } else {
    document.getElementById('quiz').innerHTML = `
      <div class="empty-state">
        <span class="empty-icon">❌</span>
        <strong>No test specified</strong>
        <span>Please select a test from the dashboard.</span>
      </div>
    `;
  }
});

// ============================================================
// API CALLS
// ============================================================
async function apiCall(endpoint, options = {}) {
  const token = localStorage.getItem('studentToken');
  if (!token) {
    window.location.href = 'login.html';
    return;
  }

  const defaultOptions = {
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json'
    }
  };

  const response = await fetch(`${API_BASE}${endpoint}`, {
    ...defaultOptions,
    ...options
  });

  const data = await response.json();

  if (!response.ok) {
    if (response.status === 401) {
      localStorage.removeItem('studentToken');
      window.location.href = 'login.html';
    }
    throw new Error(data.message || 'Something went wrong');
  }

  return data;
}

// ============================================================
// TEST FUNCTIONS
// ============================================================
async function startNewTest(testId) {
  try {
    const response = await apiCall('/tests/start', {
      method: 'POST',
      body: JSON.stringify({ testId })
    });

    const { data } = response;
    state.attemptId = data.attempt._id;
    state.questions = data.questions;
    state.timeLeft = data.duration * 60;
    state.totalDuration = data.duration * 60;

    // Update UI
    document.getElementById('testTitle').textContent = data.attempt.testId || 'Online Test';
    document.getElementById('totalMarksDisplay').textContent = data.totalMarks;
    document.getElementById('totalQuestionsDisplay').textContent = data.totalQuestions;

    renderTest();
    startTimer();

    // Auto-save answers periodically
    setInterval(autoSaveAnswers, 30000);

  } catch (error) {
    console.error('Error starting test:', error);
    document.getElementById('quiz').innerHTML = `
      <div class="empty-state">
        <span class="empty-icon">⚠️</span>
        <strong>Error loading test</strong>
        <span>${error.message}</span>
      </div>
    `;
  }
}

async function resumeTest(attemptId) {
  try {
    const response = await apiCall(`/attempts/${attemptId}/questions`);
    const { data } = response;

    state.attemptId = attemptId;
    state.questions = data.questions;
    state.timeLeft = data.remainingTime || 0;

    // Reconstruct answers from attempt
    data.questions.forEach(q => {
      if (q.selectedOption) {
        state.answers[q._id] = q.selectedOption;
      }
    });

    renderTest();
    startTimer();

  } catch (error) {
    console.error('Error resuming test:', error);
    document.getElementById('quiz').innerHTML = `
      <div class="empty-state">
        <span class="empty-icon">⚠️</span>
        <strong>Error loading test</strong>
        <span>${error.message}</span>
      </div>
    `;
  }
}

// ============================================================
// RENDER FUNCTIONS
// ============================================================
function renderTest() {
  renderQuestionNav();
  renderCurrentQuestion();
  updateProgress();
}

function renderQuestionNav() {
  const nav = document.getElementById('questionNav');
  nav.innerHTML = state.questions.map((q, index) => {
    let classes = 'question-dot';
    if (index === state.currentIndex) classes += ' active';
    if (state.answers[q._id]) classes += ' answered';
    if (state.markedForReview.has(q._id)) classes += ' review';
    
    return `<button class="${classes}" onclick="goToQuestion(${index})">${index + 1}</button>`;
  }).join('');
}

function renderCurrentQuestion() {
  const q = state.questions[state.currentIndex];
  if (!q) return;

  const quizEl = document.getElementById('quiz');
  const total = state.questions.length;
  const current = state.currentIndex + 1;
  document.getElementById('questionCounter').textContent = `${current} / ${total}`;

  const optionsHtml = q.options.map(option => {
    const isChecked = state.answers[q._id] === option.text;
    return `
      <label class="option-label">
        <input type="radio" 
               name="q${q._id}" 
               value="${escapeHTML(option.text)}"
               ${isChecked ? 'checked' : ''}
               onchange="selectOption('${q._id}', '${escapeHTML(option.text)}')">
        <span class="option-text">${escapeHTML(option.text)}</span>
      </label>
    `;
  }).join('');

  quizEl.innerHTML = `
    <div class="question-block mcq">
      <span class="question-type mcq-type">📝 MCQ</span>
      <span class="question-number">Question ${current} of ${total}</span>
      <div class="question-text">${escapeHTML(q.questionText)}</div>
      <div class="options">
        ${optionsHtml}
      </div>
      ${state.markedForReview.has(q._id) ? 
        '<div style="margin-top:12px; color: var(--purple); font-size:13px;">🔖 Marked for Review</div>' : 
        ''}
    </div>
  `;
}

function updateProgress() {
  const answered = Object.keys(state.answers).length;
  const total = state.questions.length;
  const progress = total > 0 ? (answered / total) * 100 : 0;
  document.getElementById('progressBar').style.width = `${progress}%`;
}

// ============================================================
// NAVIGATION FUNCTIONS
// ============================================================
function goToQuestion(index) {
  if (index >= 0 && index < state.questions.length) {
    state.currentIndex = index;
    renderTest();
  }
}

function nextQuestion() {
  if (state.currentIndex < state.questions.length - 1) {
    state.currentIndex++;
    renderTest();
  }
}

function previousQuestion() {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    renderTest();
  }
}

// ============================================================
// ANSWER FUNCTIONS
// ============================================================
function selectOption(questionId, optionText) {
  state.answers[questionId] = optionText;
  renderQuestionNav();
  updateProgress();
  autoSaveAnswers(); // Save immediately on selection
}

function toggleReview() {
  const q = state.questions[state.currentIndex];
  if (!q) return;

  if (state.markedForReview.has(q._id)) {
    state.markedForReview.delete(q._id);
  } else {
    state.markedForReview.add(q._id);
  }
  renderTest();
}

// ============================================================
// TIMER FUNCTIONS
// ============================================================
function startTimer() {
  const timerEl = document.getElementById('timer');

  if (state.timerInterval) {
    clearInterval(state.timerInterval);
  }

  state.timerInterval = setInterval(() => {
    state.timeLeft--;

    const minutes = Math.floor(state.timeLeft / 60);
    const seconds = state.timeLeft % 60;

    timerEl.textContent = 
      String(minutes).padStart(2, '0') + ':' + 
      String(seconds).padStart(2, '0');

    timerEl.classList.remove('timer-warning', 'timer-danger');
    if (state.timeLeft < 60) {
      timerEl.classList.add('timer-danger');
    } else if (state.timeLeft < 300) {
      timerEl.classList.add('timer-warning');
    }

    if (state.timeLeft <= 0) {
      clearInterval(state.timerInterval);
      timerEl.textContent = '00:00';
      alert('⏰ Time Up! Test will be auto-submitted.');
      submitTest();
    }
  }, 1000);
}

// ============================================================
// AUTO-SAVE ANSWERS
// ============================================================
async function autoSaveAnswers() {
  if (state.isSubmitted || !state.attemptId) return;

  const q = state.questions[state.currentIndex];
  if (!q) return;

  try {
    const selectedOption = state.answers[q._id] || null;
    await apiCall('/tests/save-answer', {
      method: 'POST',
      body: JSON.stringify({
        attemptId: state.attemptId,
        questionId: q._id,
        selectedOption: selectedOption || '',
        timeSpent: 0
      })
    });
  } catch (error) {
    console.error('Auto-save error:', error);
  }
}

// ============================================================
// SUBMIT FUNCTIONS
// ============================================================
function showSubmitModal() {
  const total = state.questions.length;
  const answered = Object.keys(state.answers).length;
  const unanswered = total - answered;
  const reviewCount = state.markedForReview.size;

  document.getElementById('modalTotal').textContent = total;
  document.getElementById('modalAnswered').textContent = answered;
  document.getElementById('modalUnanswered').textContent = unanswered;
  document.getElementById('modalReview').textContent = reviewCount;

  document.getElementById('submitModal').classList.add('active');
}

function closeModal() {
  document.getElementById('submitModal').classList.remove('active');
}

async function submitTest() {
  if (state.isSubmitted) return;

  closeModal();

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = '⏳ Submitting...';

  if (state.timerInterval) {
    clearInterval(state.timerInterval);
  }

  try {
    const response = await apiCall('/tests/submit', {
      method: 'POST',
      body: JSON.stringify({
        attemptId: state.attemptId
      })
    });

    state.isSubmitted = true;
    const { data } = response;

    alert(
      '✅ Test Submitted Successfully!\n\n' +
      `📊 Score: ${data.marksObtained}/${data.totalMarks}\n` +
      `📈 Percentage: ${data.percentage}%\n` +
      `✅ Passed: ${data.isPassed ? 'Yes' : 'No'}\n\n` +
      'View detailed results in the Results section.'
    );

    submitBtn.textContent = '✅ Submitted';
    submitBtn.disabled = true;

    // Redirect to results
    window.location.href = `/student/results.html?result=${data.resultId}`;

  } catch (error) {
    console.error('Submit error:', error);
    alert('❌ Error submitting test: ' + error.message);
    submitBtn.disabled = false;
    submitBtn.textContent = '📤 Submit Test';
    if (!state.isSubmitted) {
      startTimer();
    }
  }
}

// ============================================================
// UTILITY FUNCTIONS
// ============================================================
function escapeHTML(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'Enter') {
    e.preventDefault();
    showSubmitModal();
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    previousQuestion();
  }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    nextQuestion();
  }
});

// ============================================================
// BEFORE UNLOAD HANDLER
// ============================================================
window.addEventListener('beforeunload', (e) => {
  if (!state.isSubmitted && Object.keys(state.answers).length > 0) {
    e.preventDefault();
    e.returnValue = 'You have unsaved answers. Are you sure you want to leave?';
  }
});
</script>
