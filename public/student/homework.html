<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Homework — Chawla Classes</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
    <link rel="shortcut icon" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A1628;
    --navy-mid: #1E3A6E;
    --gold: #F5A623;
    --gold-dim: #c8841a;
    --gold-glow: rgba(245,166,35,0.18);
    --white: #F8F9FC;
    --text: #e2e8f4;
    --muted: #7a90b8;
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --surface: rgba(30,58,110,0.35);
    --success: #22c55e;
    --danger: #ef4444;
    --input-bg: rgba(10,22,40,0.7);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--navy);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(245,166,35,0.06) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(30,58,110,0.5) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 28px 20px 80px; }

  header {
    display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;
    margin-bottom: 24px; padding: 20px 28px;
    background: var(--surface); border: 1px solid var(--card-border); border-radius: var(--radius);
    backdrop-filter: blur(20px); position: relative; overflow: hidden;
  }
  header::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: linear-gradient(180deg, var(--gold), var(--gold-dim)); border-radius: 4px 0 0 4px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header-icon {
    width: 44px; height: 44px; background: var(--gold-glow); border: 1px solid rgba(245,166,35,0.25);
    border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin: 0 0 6px; }
  h1 { font-size: 24px; font-weight: 800; line-height: 1.15; margin: 0 0 4px; color: var(--white); }
  .subtitle { font-size: 13px; color: var(--muted); margin: 0; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab-btn {
    padding: 9px 18px; border-radius: var(--radius-sm); border: 1px solid var(--card-border);
    background: var(--card-bg); color: var(--muted); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .tab-btn.active { background: var(--gold-glow); color: var(--gold); border-color: rgba(245,166,35,0.3); }

  .hw-card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-top: 2.5px solid var(--gold);
    border-radius: var(--radius-sm); padding: 18px 20px; margin-bottom: 14px; backdrop-filter: blur(12px);
  }
  .hw-card.overdue { border-top-color: var(--danger); }
  .hw-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .hw-title { font-size: 16px; font-weight: 700; color: var(--white); }
  .hw-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .hw-desc { font-size: 13px; color: var(--text); margin: 10px 0; line-height: 1.5; }

  .status-badge { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .status-pending { background: rgba(245,166,35,0.15); color: #fcd34d; }
  .status-submitted { background: rgba(59,130,246,0.15); color: #93c5fd; }
  .status-graded { background: rgba(34,197,94,0.15); color: #86efac; }
  .status-overdue { background: rgba(239,68,68,0.15); color: #fca5a5; }

  .hw-attachment {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--gold);
    text-decoration: none; margin-bottom: 10px;
  }
  .hw-attachment:hover { text-decoration: underline; }

  .hw-submit-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .hw-file-input {
    font-size: 12.5px; color: var(--muted); background: var(--input-bg); border: 1px solid var(--card-border);
    border-radius: var(--radius-sm); padding: 8px 10px; flex: 1; min-width: 180px;
  }

  .hw-grade-box {
    margin-top: 10px; padding: 10px 14px; background: rgba(34,197,94,0.06);
    border: 1px solid rgba(34,197,94,0.2); border-radius: var(--radius-sm); font-size: 13px;
  }
  .hw-grade-box strong { color: #86efac; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px;
    border: 1px solid var(--card-border); border-radius: var(--radius-sm); background: var(--card-bg);
    color: var(--text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; text-decoration: none;
  }
  .btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-glow); }
  .btn-gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-dim)); color: var(--navy); border: none;
    box-shadow: 0 3px 12px var(--gold-glow);
  }
  .btn-gold:hover { box-shadow: 0 5px 20px rgba(245,166,35,0.35); transform: translateY(-1px); color: var(--navy); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
  .btn-group { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

  .table-card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius);
    backdrop-filter: blur(12px); overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); padding: 14px 20px; border-bottom: 1px solid var(--card-border); background: rgba(30,58,110,0.25);
  }
  tbody td { padding: 14px 20px; font-size: 13.5px; color: var(--text); border-bottom: 1px solid var(--card-border); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(255,255,255,0.03); }

  .banner {
    display: none; padding: 13px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 18px; border: 1px solid transparent;
  }
  .banner.show { display: block; }
  .banner.error { background: rgba(239,68,68,0.08); color: #fca5a5; border-color: rgba(239,68,68,0.2); }
  .banner.success { background: rgba(34,197,94,0.08); color: #86efac; border-color: rgba(34,197,94,0.2); }

  .empty-state { padding: 60px 20px; text-align: center; color: var(--muted); }
  .empty-state strong { display: block; color: var(--white); font-size: 15px; margin-bottom: 4px; }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

  @media (max-width: 640px) {
    .wrap { padding: 16px 12px 60px; }
    header { padding: 16px 18px; flex-direction: column; align-items: flex-start; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr { border-bottom: 1px solid var(--card-border); padding: 14px 16px; }
    tbody td { border-bottom: none; padding: 4px 0; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="header-left">
      <div class="header-icon">📚</div>
      <div>
        <p class="eyebrow">Student Portal</p>
        <h1>My Homework</h1>
        <p class="subtitle">Assignments, due dates and your submissions</p>
      </div>
    </div>
  </header>

  <div class="banner" id="banner" role="status" aria-live="polite"></div>

  <div class="tabs">
    <button class="tab-btn active" id="tabCurrentBtn" onclick="switchTab('current')">Current Homework</button>
    <button class="tab-btn" id="tabHistoryBtn" onclick="switchTab('history')">Submission History</button>
  </div>

  <div id="currentView"></div>

  <div id="historyView" style="display:none;">
    <div class="table-card">
      <table>
        <thead><tr><th>Homework</th><th>Submitted</th><th>Status</th><th>Marks</th><th>Remarks</th></tr></thead>
        <tbody id="historyTable">
          <tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="btn-group">
    <a href="/student/dashboard.html" class="btn">‹ Back to Dashboard</a>
  </div>

</div>

<script>
  const API_BASE = '/api/student';
  const token = localStorage.getItem('studentToken');
  if (!token) { window.location.href = '/student/login.html'; }

  async function apiCall(endpoint, options = {}) {
    const defaultOptions = { headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } };
    try {
      const response = await fetch(`${API_BASE}${endpoint}`, { ...defaultOptions, ...options });
      if (response.status === 401) {
        showBanner('Session expired. Redirecting to login...', 'error');
        setTimeout(() => { localStorage.removeItem('studentToken'); window.location.href = '/student/login.html'; }, 1500);
        return null;
      }
      return await response.json();
    } catch (error) {
      showBanner('Network error. Please try again.', 'error');
      return null;
    }
  }

  function showBanner(msg, type) {
    const banner = document.getElementById('banner');
    banner.textContent = msg;
    banner.className = `banner show ${type}`;
    setTimeout(() => banner.classList.remove('show'), 4000);
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function switchTab(tab) {
    document.getElementById('tabCurrentBtn').classList.toggle('active', tab === 'current');
    document.getElementById('tabHistoryBtn').classList.toggle('active', tab === 'history');
    document.getElementById('currentView').style.display = tab === 'current' ? 'block' : 'none';
    document.getElementById('historyView').style.display = tab === 'history' ? 'block' : 'none';
    if (tab === 'history') loadHistory();
  }

  function statusInfo(hw) {
    if (hw.submission && hw.submission.status === 'graded') return { label: 'Graded', cls: 'status-graded' };
    if (hw.submission) return { label: hw.submission.isLate ? 'Submitted (Late)' : 'Submitted', cls: 'status-submitted' };
    if (hw.submissionStatus === 'overdue') return { label: 'Overdue', cls: 'status-overdue' };
    return { label: 'Pending', cls: 'status-pending' };
  }

  async function loadCurrent() {
    const result = await apiCall('/homework');
    if (!result || !result.success) return;
    const homework = result.data || [];
    const view = document.getElementById('currentView');

    if (homework.length === 0) {
      view.innerHTML = `<div class="table-card"><div class="empty-state"><span class="icon">📚</span><strong>No Homework Yet</strong><p>Your teacher hasn't assigned anything yet.</p></div></div>`;
      return;
    }

    view.innerHTML = homework.map(hw => {
      const st = statusInfo(hw);
      const overdue = st.cls === 'status-overdue';
      const canSubmit = !hw.submission || hw.submission.status !== 'graded';

      return `
        <div class="hw-card ${overdue ? 'overdue' : ''}">
          <div class="hw-card-head">
            <div>
              <div class="hw-title">${escapeHtml(hw.title)}</div>
              <div class="hw-meta">Due ${new Date(hw.dueDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })} · ${hw.marks} marks</div>
            </div>
            <span class="status-badge ${st.cls}">${st.label}</span>
          </div>
          ${hw.description ? `<div class="hw-desc">${escapeHtml(hw.description)}</div>` : ''}
          ${hw.attachmentFilename ? `<a class="hw-attachment" href="/homework-files/${hw.attachmentFilename}" target="_blank">📎 ${escapeHtml(hw.attachmentOriginalName || 'Attachment')}</a>` : ''}

          ${hw.submission && hw.submission.status === 'graded' ? `
            <div class="hw-grade-box">
              <strong>${hw.submission.marksAwarded} / ${hw.marks}</strong> marks
              ${hw.submission.teacherRemarks ? `<br>“${escapeHtml(hw.submission.teacherRemarks)}”` : ''}
            </div>
          ` : ''}

          ${hw.submission ? `
            <div class="hw-submit-row">
              <button class="btn" onclick="downloadOwnSubmission('${hw.submission._id}')">⬇ ${escapeHtml(hw.submission.originalName)}</button>
              ${canSubmit ? `<span style="font-size:12px;color:var(--muted);">You can replace this until it's graded.</span>` : ''}
            </div>
          ` : ''}

          ${canSubmit ? `
            <div class="hw-submit-row">
              <input type="file" class="hw-file-input" id="file-${hw._id}" accept=".pdf,.png,.jpg,.jpeg">
              <button class="btn btn-gold" onclick="submitHomework('${hw._id}', this)">${hw.submission ? 'Replace Submission' : 'Upload Submission'}</button>
            </div>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  async function submitHomework(homeworkId, btn) {
    const fileInput = document.getElementById(`file-${homeworkId}`);
    const file = fileInput.files[0];
    if (!file) { showBanner('Choose a file first', 'error'); return; }

    const formData = new FormData();
    formData.append('file', file);

    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Uploading...';

    try {
      const result = await apiCall(`/homework/${homeworkId}/submit`, {
        method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: formData
      });
      if (!result || !result.success) { showBanner(result?.message || 'Failed to submit', 'error'); return; }
      showBanner(result.message || 'Submitted successfully', 'success');
      loadCurrent();
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  function downloadOwnSubmission(submissionId) {
    fetch(`${API_BASE}/homework/submissions/${submissionId}/download`, { headers: { 'Authorization': `Bearer ${token}` } })
      .then(res => res.blob())
      .then(blob => {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = ''; document.body.appendChild(a); a.click(); a.remove();
        window.URL.revokeObjectURL(url);
      })
      .catch(() => showBanner('Failed to download', 'error'));
  }

  async function loadHistory() {
    const result = await apiCall('/homework/submissions/history');
    const tbody = document.getElementById('historyTable');
    if (!result || !result.success) { tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px;">Failed to load</td></tr>`; return; }

    const submissions = result.data || [];
    if (submissions.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px;">No submissions yet</td></tr>`;
      return;
    }

    tbody.innerHTML = submissions.map(s => {
      const statusLabel = s.status === 'graded' ? 'Graded' : (s.isLate ? 'Submitted (Late)' : 'Submitted');
      const statusCls = s.status === 'graded' ? 'status-graded' : 'status-submitted';
      return `
        <tr>
          <td>${escapeHtml(s.homeworkTitle)}</td>
          <td>${new Date(s.submittedAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</td>
          <td><span class="status-badge ${statusCls}">${statusLabel}</span></td>
          <td>${s.marksAwarded !== null && s.marksAwarded !== undefined ? `${s.marksAwarded} / ${s.homeworkMarks}` : '-'}</td>
          <td>${s.teacherRemarks ? escapeHtml(s.teacherRemarks) : '-'}</td>
        </tr>
      `;
    }).join('');
  }

  loadCurrent();
</script>
<script src="/student/js/idle-logout.js"></script>
</body>
</html>
